<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<title>游戏厅 · 坦克大战 &amp; 五子棋</title>
<style>

  html,body{margin:0;height:100%;background:#070b12;color:#e6eefb;overflow:hidden;
    font-family:system-ui,-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  .view{display:none;position:fixed;inset:0}
  .view.active{display:block}
  #home{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;padding:26px;background:radial-gradient(120% 90% at 50% 0%,#182538 0%,#070b12 70%)}
  #home.active{display:flex}
  .home-title{font-size:34px;font-weight:900;letter-spacing:6px;
    background:linear-gradient(180deg,#b5f7e0,#4fd1a5);-webkit-background-clip:text;background-clip:text;color:transparent}
  .home-sub{font-size:12px;color:#74849c;letter-spacing:2px;margin-top:-8px}
  .game-card{width:100%;max-width:420px;display:flex;align-items:center;gap:14px;text-align:left;
    padding:18px;border-radius:18px;border:1px solid #26344a;background:#121b28;color:#e6eefb;
    cursor:pointer;transition:.15s;font:inherit}
  .game-card:active{transform:scale(.985)}
  .game-card .emoji{font-size:28px;width:44px;text-align:center}
  .game-card .txt{display:flex;flex-direction:column;gap:3px}
  .game-card .name{font-size:18px;font-weight:800;letter-spacing:1px}
  .game-card .desc{font-size:12px;color:#74849c}
  .game-card.tank{border-color:#2e8f6f}
  .game-card.gomoku{border-color:#3a5170}
  .home-foot{margin-top:6px;font-size:11px;color:#5c6b80;text-align:center;line-height:1.7}
  .shell-home{position:fixed;left:8px;top:8px;z-index:60;padding:6px 12px;border-radius:10px;
    border:1px solid rgba(140,200,255,.35);background:rgba(18,27,40,.82);color:#cfe0f5;
    font-size:13px;font-weight:700;cursor:pointer;backdrop-filter:blur(4px)}

#view-tank #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
#view-tank canvas{display:block;touch-action:none;box-shadow:0 0 48px rgba(0,0,0,.75);}
#view-tank .pad{position:fixed;z-index:5;touch-action:none;display:none;}
body.touch #view-tank .pad{display:block;}
#view-tank .btn{display:flex;align-items:center;justify-content:center;
    border-radius:14px;background:rgba(52,74,104,.55);border:1px solid rgba(140,200,255,.45);
    color:#dbe9ff;font:700 22px/1 system-ui,-apple-system,"Microsoft YaHei",sans-serif;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
#view-tank #dpad{left:16px;bottom:16px;width:180px;height:180px;
    grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:6px;}
body.touch #view-tank #dpad{display:grid;}
#view-tank #dpad .btn{width:56px;height:56px;}
#view-tank #dpad .btn[data-key="up"]{grid-column:2;grid-row:1;}
#view-tank #dpad .btn[data-key="left"]{grid-column:1;grid-row:2;}
#view-tank #dpad .btn[data-key="right"]{grid-column:3;grid-row:2;}
#view-tank #dpad .btn[data-key="down"]{grid-column:2;grid-row:3;}
#view-tank #fire{position:fixed;right:20px;bottom:34px;width:96px;height:96px;border-radius:50%;
    background:radial-gradient(circle at 35% 28%,rgba(255,130,150,.8),rgba(190,35,65,.6));
    border:2px solid rgba(255,150,170,.9);color:#fff;font-size:20px;}
#view-tank #tools{position:fixed;right:20px;bottom:150px;z-index:6;display:none;flex-direction:row;}
body.touch #view-tank #tools{display:flex;}
#view-tank #tools .btn{width:46px;height:46px;border-radius:12px;font-size:16px;margin:0 5px;}
#view-tank #rotate{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;background:rgba(6,9,14,.95);
    color:#dbe4f0;font:600 20px/1.7 system-ui,-apple-system,"Microsoft YaHei",sans-serif;
    text-align:center;padding:28px;}
body.portrait #view-tank #rotate{display:flex;}
#view-tank #rotate .big{font-size:30px;color:#ffb02e;letter-spacing:2px}
#view-tank #rotate .sub{font-size:14px;color:#7b8798;font-weight:400}
#view-tank #rotate button{margin-top:10px;padding:11px 24px;border-radius:12px;
    border:1px solid rgba(140,200,255,.5);background:rgba(52,74,104,.6);
    color:#dbe4f0;font-size:15px;font-weight:600}
:root{--bg:#0b1017; --panel:#131c28; --line:#26344a; --fg:#dbe6f5; --dim:#74849c;
    --black:#1b2330; --white:#eef3fb; --accent:#4fd1a5; --warn:#ff6b81;}
#view-gomoku *{box-sizing:border-box}
#view-gomoku #app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    padding:10px calc(10px + env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));
    padding-left:calc(10px + env(safe-area-inset-left));padding-right:calc(10px + env(safe-area-inset-right));}
#view-gomoku header{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:640px;padding:4px 2px}
#view-gomoku header h1{font-size:18px;margin:0;letter-spacing:2px;font-weight:800}
#view-gomoku header .sub{font-size:11px;color:var(--dim)}
#view-gomoku .card{width:100%;max-width:640px;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:16px;margin-top:10px}
#view-gomoku .btn{appearance:none;border:1px solid var(--line);background:#1a2534;color:var(--fg);
    border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;
    transition:.15s;width:100%}
#view-gomoku .btn:hover{background:#223044}
#view-gomoku .btn:active{transform:scale(.98)}
#view-gomoku .btn.primary{background:linear-gradient(180deg,#2e8f6f,#1f6b53);border-color:#3fbf94}
#view-gomoku .btn.ghost{background:transparent}
#view-gomoku .btn:disabled{opacity:.4;cursor:default}
#view-gomoku .row{display:flex;gap:10px}
#view-gomoku .row > *{flex:1}
#view-gomoku input{width:100%;background:#0e1622;border:1px solid var(--line);color:var(--fg);
    border-radius:12px;padding:12px;font-size:20px;text-align:center;letter-spacing:6px;font-weight:700}
#view-gomoku input::placeholder{letter-spacing:1px;font-weight:400;color:#5c6b80}
#view-gomoku .muted{color:var(--dim);font-size:12px;line-height:1.6}
#view-gomoku #status{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;
    padding:8px 14px;border-radius:999px;background:#0f1824;border:1px solid var(--line)}
#view-gomoku .dot{width:16px;height:16px;border-radius:50%;border:1px solid #0006}
#view-gomoku .dot.black{background:var(--black);box-shadow:0 0 0 2px #ffffff22}
#view-gomoku .dot.white{background:var(--white)}
#view-gomoku #boardWrap{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
#view-gomoku canvas{display:block;touch-action:none;border-radius:10px}
#view-gomoku #actions{display:flex;gap:10px;width:100%;max-width:640px;margin-top:8px}
#view-gomoku #actions .btn{padding:10px;font-size:14px}
#view-gomoku .hide{display:none !important}
#view-gomoku #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
    background:#1d2a3d;border:1px solid var(--line);padding:10px 18px;border-radius:999px;
    font-size:13px;opacity:0;transition:.25s;pointer-events:none}
#view-gomoku #toast.show{opacity:1}
#view-gomoku #linkBox{word-break:break-all;font-size:12px;color:#9fb3cc;background:#0e1622;
    border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0}
#view-gomoku .code{font-size:34px;font-weight:800;letter-spacing:10px;text-align:center;color:var(--accent);
    margin:6px 0 2px}
#view-gomoku .center{text-align:center}
#view-gomoku .tag{display:inline-block;font-size:11px;color:#0b1017;background:var(--accent);
    border-radius:999px;padding:2px 8px;font-weight:800;vertical-align:middle}
</style>
</head>
<body>
<div id="home">
  <div class="home-title">游戏厅</div>
  <div class="home-sub">奶龙陪你玩 · 手机版</div>
  <button class="game-card tank" data-go="tank">
    <span class="emoji">🐲</span>
    <span class="txt">
      <span class="name">坦克大战 · 奶龙版</span>
      <span class="desc">补给掉落 · 黑化奶龙 Boss · 触摸操作</span>
    </span>
  </button>
  <button class="game-card gomoku" data-go="gomoku">
    <span class="emoji">⚫</span>
    <span class="txt">
      <span class="name">五子棋</span>
      <span class="desc">同屏双人 / 房间号联机邀请好友</span>
    </span>
  </button>
  <div class="home-foot">五子棋联机需在电脑上运行 start-gomoku.bat<br>两台手机连同一个 WiFi，打开电脑给出的地址</div>
</div>

<div id="view-tank" class="view">

<button id="tankHome" class="shell-home">‹ 返回</button>
<div id="wrap"><canvas id="t-game"></canvas></div>
<div id="dpad" class="pad">
  <div class="btn" data-key="up">▲</div>
  <div class="btn" data-key="down">▼</div>
  <div class="btn" data-key="left">◀</div>
  <div class="btn" data-key="right">▶</div>
</div>
<div id="tools" class="pad">
  <div class="btn" data-act="pause">❚❚</div>
  <div class="btn" data-act="restart">↻</div>
</div>
<div id="fire" class="btn pad" data-key="fire">开火</div>
<div id="rotate">
  <div class="big">请把手机横过来</div>
  <div class="sub">横屏才能看清整个战场 · 奶龙在等你</div>
  <button id="stayPortrait">仍要竖屏玩</button>
</div>


</div>

<div id="view-gomoku" class="view">

<div id="app">
  <header>
    <h1>五子棋</h1>
    <div class="sub" id="modeLabel">同屏双人</div>
  </header>

  <!-- 主菜单 -->
  <section id="menu" class="card">
    <p class="muted" style="margin-top:0">15×15 棋盘，先连成五子者胜。轮到黑棋先手。</p>
    <button class="btn primary" id="btnLocal">同屏双人（一台手机轮流玩）</button>
    <div style="height:10px"></div>
    <button class="btn" id="btnOnline">联机对战（邀请好友）</button>
    <div style="height:10px"></div>
    <button class="btn ghost" id="gomokuHome">返回游戏厅</button>
    <p class="muted" style="margin-bottom:0">联机需要电脑上先运行 <b>gomoku-server.mjs</b>，两台手机连同一 WiFi 后打开电脑给出的地址。</p>
  </section>

  <!-- 联机大厅 -->
  <section id="lobby" class="card hide">
    <div id="lobbyHome">
      <button class="btn primary" id="btnCreate">创建房间</button>
      <p class="muted center" style="margin:14px 0 8px">或者输入好友给你的房间号</p>
      <input id="roomInput" inputmode="numeric" maxlength="4" placeholder="4 位房间号">
      <div style="height:10px"></div>
      <button class="btn" id="btnJoin">加入房间</button>
    </div>
    <div id="lobbyWait" class="hide center">
      <div class="muted">房间号</div>
      <div class="code" id="roomCode">----</div>
      <div class="muted" id="seatInfo">你是黑棋（先手）</div>
      <div id="linkBox">—</div>
      <button class="btn primary" id="btnCopy">复制邀请链接</button>
      <div style="height:8px"></div>
      <button class="btn ghost" id="btnShare">分享给好友</button>
      <p class="muted" id="waitMsg">等待对手加入…</p>
    </div>
    <button class="btn ghost" id="btnBack" style="margin-top:12px">返回</button>
  </section>

  <!-- 对局 -->
  <section id="game" class="hide" style="display:flex;flex-direction:column;flex:1;width:100%;align-items:center;min-height:0">
    <div id="status"><span class="dot black" id="turnDot"></span><span id="turnText">黑棋回合</span></div>
    <div id="boardWrap"><canvas id="board"></canvas></div>
    <div id="actions">
      <button class="btn" id="btnUndo">悔棋</button>
      <button class="btn primary" id="btnRestart">重新开始</button>
      <button class="btn" id="btnLeave">返回</button>
    </div>
  </section>

  <div id="toast"></div>
</div>



</div>

var FONT = 'system-ui,-apple-system,"Microsoft YaHei","PingFang SC",sans-serif';

function hexToRgb(h) {
  h = h.replace("#", "");
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function lerpColor(a, b, t) {
  var A = hexToRgb(a), B = hexToRgb(b);
  return "rgb(" + Math.round(A[0] + (B[0] - A[0]) * t) + "," +
    Math.round(A[1] + (B[1] - A[1]) * t) + "," +
    Math.round(A[2] + (B[2] - A[2]) * t) + ")";
}
function rnd(a, b) { return a + Math.random() * (b - a); }
function overlap(a, b) { return a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1]; }
function tankRect(t) { var h = halfOf(t); return [t.x - h, t.y - h, t.x + h, t.y + h]; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

function buildTiles() {
  var t = new Map();
  function fill(c0, r0, c1, r1, k) {
    for (var r = r0; r <= r1; r++) for (var c = c0; c <= c1; c++) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
      t.set(r * COLS + c, k);
    }
  }
  fill(4, 3, 4, 5, "B"); fill(4, 8, 4, 11, "B");
  fill(19, 3, 19, 5, "B"); fill(19, 8, 19, 11, "B");
  fill(6, 6, 7, 7, "S"); fill(16, 6, 17, 7, "S");
  fill(1, 3, 2, 4, "B"); fill(21, 3, 22, 4, "B");
  fill(1, 9, 2, 10, "B"); fill(21, 9, 22, 10, "B");
  fill(7, 4, 9, 4, "B"); fill(14, 4, 16, 4, "B");
  fill(7, 11, 9, 11, "B"); fill(14, 11, 16, 11, "B");
  fill(5, 13, 6, 13, "B"); fill(17, 13, 18, 13, "B");
  return t;
}

function tilesInRect(g, x0, y0, x1, y1) {
  var out = [];
  if (x1 <= x0 || y1 <= y0) return out;
  var c0 = Math.max(0, Math.floor(x0 / CELL)), c1 = Math.min(COLS - 1, Math.floor((x1 - 0.001) / CELL));
  var r0 = Math.max(0, Math.floor(y0 / CELL)), r1 = Math.min(ROWS - 1, Math.floor((y1 - 0.001) / CELL));
  for (var r = r0; r <= r1; r++) for (var c = c0; c <= c1; c++) {
    var k = r * COLS + c;
    if (g.tiles.has(k)) out.push(k);
  }
  return out;
}

function makeTank(x, y, kind) {
  var hp = kind === "player" ? PLAYER_HP : 1;
  return {
    x: x, y: y, kind: kind,
    half: TANK_HALF,
    dir: kind === "player" ? "up" : "down",
    hp: hp, maxHp: hp,
    cool: 0, invuln: 0,
    think: rnd(0.1, 0.9),
    alive: true,
    spawnFlash: kind === "enemy" ? 0.45 : 0,
    elite: false,
    powerT: 0, shieldT: 0, speedT: 0
  };
}
function halfOf(t) { return t.half || TANK_HALF; }
function speedOf(t) { return t.kind === "player" ? PLAYER_SPEED : (t.elite ? 66 : ENEMY_SPEED); }

function moveTank(g, t, dx, dy) {
  var nx = t.x + dx, ny = t.y + dy, h = halfOf(t);
  if (nx - h < 0 || nx + h > W || ny - h < 0 || ny + h > H) return false;
  var rect = [nx - h, ny - h, nx + h, ny + h];
  if (tilesInRect(g, rect[0], rect[1], rect[2], rect[3]).length) return false;
  for (var i = 0; i < g.tanks.length; i++) {
    var o = g.tanks[i];
    if (o === t || !o.alive) continue;
    if (overlap(rect, tankRect(o))) return false;
  }
  t.x = nx; t.y = ny;
  return true;
}

function makeBullet(x, y, dir, owner) {
  var v = DIRV[dir];
  return { x: x, y: y, vx: v[0] * BULLET_SPEED, vy: v[1] * BULLET_SPEED, owner: owner, alive: true };
}

// ---------------------------------------------------------------------------
// 游戏状态
// ---------------------------------------------------------------------------
function createGame(canvas, ctx) {
  var g = {
    canvas: canvas, ctx: ctx, bg: null,
    tiles: buildTiles(),
    tanks: [], bullets: [], particles: [], powerups: [],
    keys: new Set(),
    state: "ready",
    time: 0, score: 0, wave: 1,
    toSpawn: 0, maxAlive: 3, spawnTimer: 0, waveGap: 0,
    elitePending: 0,
    bannerText: "", bannerT: 0,
    dirty: true,
    player: null
  };
  reset(g);
  return g;
}

function reset(g) {
  g.tiles = buildTiles();
  g.tanks = [];
  g.bullets = [];
  g.particles = [];
  g.powerups = [];
  g.elitePending = 0;
  g.keys.clear();
  g.player = makeTank(11.5 * CELL, 14.5 * CELL, "player");
  g.tanks.push(g.player);
  g.state = "ready";
  g.score = 0;
  g.wave = 1;
  g.toSpawn = 0;
  g.spawnTimer = 0;
  g.waveGap = 0;
  g.bannerText = "";
  g.bannerT = 0;
  g.dirty = true;
}

function startGame(g) {
  g.tiles = buildTiles();
  g.tanks = [];
  g.bullets = [];
  g.particles = [];
  g.powerups = [];
  g.keys.clear();
  g.player = makeTank(11.5 * CELL, 14.5 * CELL, "player");
  g.tanks.push(g.player);
  g.score = 0;
  g.time = 0;
  g.state = "playing";
  banner(g, "第 1 波", 1.4);
  beginWave(g, 1);
}

function beginWave(g, n) {
  g.wave = n;
  g.toSpawn = 3 + n;
  g.maxAlive = Math.min(3 + Math.floor(n / 2), 6);
  g.spawnTimer = 0.55;
  g.waveGap = 1.35;
  g.elitePending = n >= 2 ? 1 : 0;   // 第 2 波起，每波一只黑化奶龙
  g.dirty = true;
}

function banner(g, text, secs) { g.bannerText = text; g.bannerT = secs; }

// ---------------------------------------------------------------------------
// 每帧更新
// ---------------------------------------------------------------------------
function step(g, dt) {
  if (g.bannerT > 0) g.bannerT -= dt;
  updatePlayer(g, dt);
  updateEnemies(g, dt);
  updateBullets(g, dt);
  updatePowerups(g, dt);
  updateParticles(g, dt);
  updateWaves(g, dt);
  if (g.toast) { g.toast.t -= dt; if (g.toast.t <= 0) g.toast = null; }
}

function updatePlayer(g, dt) {
  var p = g.player;
  if (!p.alive) return;
  p.cool = Math.max(0, p.cool - dt);
  if (p.invuln > 0) p.invuln -= dt;
  if (p.powerT > 0) p.powerT -= dt;
  if (p.shieldT > 0) p.shieldT -= dt;
  if (p.speedT > 0) p.speedT -= dt;

  var dx = 0, dy = 0;
  if (g.keys.has("up")) dy -= 1;
  if (g.keys.has("down")) dy += 1;
  if (g.keys.has("left")) dx -= 1;
  if (g.keys.has("right")) dx += 1;

  if (dx || dy) {
    if (dx && dy) { dx *= Math.SQRT1_2; dy *= Math.SQRT1_2; }
    if (Math.abs(dx) > Math.abs(dy)) p.dir = dx > 0 ? "right" : "left";
    else p.dir = dy > 0 ? "down" : "up";
    var spd = PLAYER_SPEED * (p.speedT > 0 ? 1.45 : 1);
    moveTank(g, p, dx * spd * dt, dy * spd * dt);
  }
  if (g.keys.has("fire") && p.cool <= 0) fire(g, p);
}

function pickDir(g, e) {
  var p = g.player;
  if (p && p.alive && Math.random() < 0.55) {
    var dx = p.x - e.x, dy = p.y - e.y;
    if (Math.abs(dx) > Math.abs(dy)) e.dir = dx > 0 ? "right" : "left";
    else e.dir = dy > 0 ? "down" : "up";
  } else {
    e.dir = DIRS[(Math.random() * 4) | 0];
  }
}

function updateEnemies(g, dt) {
  var player = g.player;
  for (var i = 0; i < g.tanks.length; i++) {
    var e = g.tanks[i];
    if (e.kind !== "enemy" || !e.alive) continue;
    e.cool = Math.max(0, e.cool - dt);
    e.think -= dt;
    if (e.spawnFlash > 0) e.spawnFlash -= dt;

    if (e.think <= 0) { e.think = rnd(0.55, 1.5); pickDir(g, e); }

    var v = DIRV[e.dir];
    if (!moveTank(g, e, v[0] * ENEMY_SPEED * dt, v[1] * ENEMY_SPEED * dt)) {
      pickDir(g, e);
      e.think = rnd(0.3, 0.8);
    }

    if (e.cool <= 0 && player.alive) {
      if (Math.abs(e.x - player.x) < 18) e.dir = player.y > e.y ? "down" : "up";
      else if (Math.abs(e.y - player.y) < 18) e.dir = player.x > e.x ? "right" : "left";
      if (e.elite) {
        fireSpread(g, e);
        e.cool = rnd(1.5, 2.3);
      } else {
        if (Math.random() < 0.72) fire(g, e);
        e.cool = rnd(1.1, 2.4);
      }
    }
  }
}

function makeBulletVec(x, y, vx, vy, owner) {
  var len = Math.sqrt(vx * vx + vy * vy) || 1;
  return { x: x, y: y, vx: vx / len * BULLET_SPEED, vy: vy / len * BULLET_SPEED, owner: owner, alive: true };
}

function fire(g, t) {
  var h = halfOf(t);
  if (t.kind === "player") t.cool = t.powerT > 0 ? 0.14 : PLAYER_FIRE_CD;
  var v = DIRV[t.dir];
  var bx = t.x + v[0] * (h + 7), by = t.y + v[1] * (h + 7);
  g.bullets.push(makeBullet(bx, by, t.dir, t));
  if (t.kind === "player" && t.powerT > 0) {
    // 火力强化：双发
    var px = -v[1], py = v[0];
    g.bullets.push(makeBullet(bx + px * 7, by + py * 7, t.dir, t));
    g.bullets.push(makeBullet(bx - px * 7, by - py * 7, t.dir, t));
  }
}

// 黑化奶龙的三向散射
function fireSpread(g, t) {
  var v = DIRV[t.dir], h = halfOf(t);
  var bx = t.x + v[0] * (h + 7), by = t.y + v[1] * (h + 7);
  var ang = Math.atan2(v[1], v[0]);
  for (var k = -1; k <= 1; k++) {
    var a = ang + k * 0.34;
    g.bullets.push(makeBulletVec(bx, by, Math.cos(a), Math.sin(a), t));
  }
}

function updateBullets(g, dt) {
  for (var i = 0; i < g.bullets.length; i++) {
    var b = g.bullets[i];
    if (!b.alive) continue;
    var total = BULLET_SPEED * dt;
    var steps = Math.max(1, Math.floor(total / 6) + 1);
    var stepLen = total / steps;
    var ux = b.vx / BULLET_SPEED, uy = b.vy / BULLET_SPEED;
    for (var s = 0; s < steps; s++) {
      b.x += ux * stepLen;
      b.y += uy * stepLen;
      if (b.x <= 0 || b.x >= W || b.y <= 0 || b.y >= H) {
        b.alive = false; boom(g, b.x, b.y, 5, ["#8899aa"]); break;
      }
      var hits = tilesInRect(g, b.x - 3, b.y - 3, b.x + 3, b.y + 3);
      if (hits.length) {
        var k = hits[0], r = Math.floor(k / COLS), c = k % COLS, kind = g.tiles.get(k);
        if (kind === "B") {
          g.tiles.delete(k); g.dirty = true;
          boom(g, c * CELL + CELL / 2, r * CELL + CELL / 2, 9, [C.brick, C.brickEdge, C.brickDark]);
        } else {
          boom(g, b.x, b.y, 6, [C.steelLight, C.steel, C.white]);
        }
        b.alive = false; break;
      }
      var victim = bulletVictim(g, b);
      if (victim) { hitTank(g, victim, b); b.alive = false; break; }
    }
  }
  var keep = [];
  for (var j = 0; j < g.bullets.length; j++) if (g.bullets[j].alive) keep.push(g.bullets[j]);
  g.bullets = keep;
}

function bulletVictim(g, b) {
  var want = b.owner.kind === "player" ? "enemy" : "player";
  for (var i = 0; i < g.tanks.length; i++) {
    var t = g.tanks[i];
    if (!t.alive || t.kind !== want) continue;
    if (overlap([b.x - 3, b.y - 3, b.x + 3, b.y + 3], tankRect(t))) return t;
  }
  return null;
}

function hitTank(g, t, bullet) {
  if (t.kind === "player") {
    if (t.shieldT > 0) {                 // 护盾挡下这一次
      boom(g, t.x, t.y, 10, ["#6fc3ff", C.white]);
      return;
    }
    if (t.invuln > 0) return;
    t.hp -= 1;
    boom(g, t.x, t.y, 14, [C.playerLight, C.bulletE]);
    if (t.hp <= 0) {
      t.alive = false;
      boom(g, t.x, t.y, 42, [C.player, C.playerLight, C.white, C.bulletE]);
      g.state = "over";
    } else {
      t.invuln = INVULN_TIME;
    }
  } else {
    t.hp -= 1;
    if (t.elite) boom(g, t.x, t.y, 10, [ELITE_GLOW, C.white]);
    else boom(g, t.x, t.y, 12, [C.enemy, C.enemyLight, C.glowB]);
    if (t.hp <= 0) {
      t.alive = false;
      if (t.elite) {
        g.score += 300 + g.wave * 30;
        boom(g, t.x, t.y, 46, [ELITE_GLOW, "#5c2a8f", C.white, C.enemy]);
        dropPowerup(g, t.x - 18, t.y, null);
        dropPowerup(g, t.x + 18, t.y, null);
      } else {
        g.score += 100 + g.wave * 20;
        boom(g, t.x, t.y, 34, [C.enemy, C.glowB, C.white]);
        if (Math.random() < 0.24) dropPowerup(g, t.x, t.y, null);
      }
    }
  }
}

// ---------------------------------------------------------------------------
// 补给
// ---------------------------------------------------------------------------
function dropPowerup(g, x, y, forced) {
  var type = forced || PU_KEYS[(Math.random() * PU_KEYS.length) | 0];
  g.powerups.push({
    x: clamp(x, 22, W - 22),
    y: clamp(y, 22, H - 22),
    type: type,
    life: PU_LIFE,
    t: 0
  });
}

function updatePowerups(g, dt) {
  var p = g.player, keep = [];
  for (var i = 0; i < g.powerups.length; i++) {
    var it = g.powerups[i];
    it.life -= dt;
    it.t += dt;
    if (it.life <= 0) continue;
    if (p && p.alive) {
      var area = [it.x - 24, it.y - 24, it.x + 24, it.y + 24];
      if (overlap(area, tankRect(p))) { applyPowerup(g, it); continue; }
    }
    keep.push(it);
  }
  g.powerups = keep;
}

function applyPowerup(g, it) {
  var d = PU[it.type], pl = g.player;
  if (it.type === "heal") pl.hp = Math.min(PLAYER_HP, pl.hp + 1);
  else if (it.type === "power") pl.powerT = d.dur;
  else if (it.type === "shield") pl.shieldT = d.dur;
  else if (it.type === "speed") pl.speedT = d.dur;
  g.score += 20;
  boom(g, it.x, it.y, 16, [d.color, C.white]);
  g.toast = { text: d.label, t: 1.2, color: d.color };
}

function boom(g, x, y, n, colors) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, sp = rnd(40, 250);
    g.particles.push({
      x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rnd(0.22, 0.62), maxLife: rnd(0.22, 0.62),
      color: colors[(Math.random() * colors.length) | 0], size: rnd(2, 5)
    });
  }
  if (g.particles.length > MAX_PARTICLES) g.particles.splice(0, g.particles.length - MAX_PARTICLES);
}

function updateParticles(g, dt) {
  var keep = [];
  for (var i = 0; i < g.particles.length; i++) {
    var p = g.particles[i];
    p.life -= dt;
    if (p.life <= 0) continue;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.96; p.vy *= 0.96;
    keep.push(p);
  }
  g.particles = keep;
}

function updateWaves(g, dt) {
  var alive = 0;
  for (var i = 0; i < g.tanks.length; i++) if (g.tanks[i].kind === "enemy" && g.tanks[i].alive) alive++;
  if (g.toSpawn > 0 || g.elitePending > 0) {
    if (alive < g.maxAlive) {
      g.spawnTimer -= dt;
      if (g.spawnTimer <= 0) {
        if (g.elitePending > 0) {
          if (spawnElite(g)) g.elitePending--;
        } else if (spawnEnemy(g)) {
          g.toSpawn--;
        }
        g.spawnTimer = rnd(0.65, 1.15);
      }
    }
  } else if (alive === 0) {
    g.waveGap -= dt;
    if (g.waveGap <= 0) {
      beginWave(g, g.wave + 1);
      banner(g, "第 " + g.wave + " 波", 1.4);
    }
  }
}

function spawnElite(g) {
  var cols = [1, 4, 7, 10, 13, 16, 19, 22];
  var pts = [];
  for (var i = 0; i < cols.length; i++) pts.push([cols[i] * CELL + CELL / 2, CELL / 2 + 4]);
  for (var j = pts.length - 1; j > 0; j--) {
    var k = (Math.random() * (j + 1)) | 0, tmp = pts[j]; pts[j] = pts[k]; pts[k] = tmp;
  }
  for (var m = 0; m < pts.length; m++) {
    var x = pts[m][0], y = pts[m][1], probe = [x - 26, y - 26, x + 26, y + 26], blocked = false;
    for (var n = 0; n < g.tanks.length; n++) {
      var t = g.tanks[n];
      if (t.alive && overlap(probe, tankRect(t))) { blocked = true; break; }
    }
    if (blocked) continue;
    var e = makeTank(x, y, "enemy");
    e.elite = true;
    e.half = 19;
    e.hp = 3; e.maxHp = 3;
    e.cool = rnd(1.4, 2.2);
    e.think = rnd(0.3, 0.9);
    g.tanks.push(e);
    boom(g, x, y, 22, [ELITE_GLOW, "#5c2a8f", C.white]);
    return true;
  }
  return false;
}

function spawnEnemy(g) {
  var cols = [1, 4, 7, 10, 13, 16, 19, 22];
  var pts = [];
  for (var i = 0; i < cols.length; i++) pts.push([cols[i] * CELL + CELL / 2, CELL / 2]);
  for (var j = pts.length - 1; j > 0; j--) {
    var k = (Math.random() * (j + 1)) | 0, tmp = pts[j]; pts[j] = pts[k]; pts[k] = tmp;
  }
  for (var m = 0; m < pts.length; m++) {
    var x = pts[m][0], y = pts[m][1], probe = [x - 24, y - 24, x + 24, y + 24], blocked = false;
    for (var n = 0; n < g.tanks.length; n++) {
      var t = g.tanks[n];
      if (t.alive && overlap(probe, tankRect(t))) { blocked = true; break; }
    }
    if (blocked) continue;
    var e = makeTank(x, y, "enemy");
    e.cool = rnd(0.9, 2.0);
    e.think = rnd(0.2, 0.8);
    g.tanks.push(e);
    boom(g, x, y, 10, [C.glowB, C.enemy, C.white]);
    return true;
  }
  return false;
}

// ---------------------------------------------------------------------------
// 渲染
// ---------------------------------------------------------------------------
function render(g) {
  var ctx = g.ctx;
  drawStatic(g);   // 每帧重绘背景层（不清屏会留下移动残影）
  for (var q = 0; q < g.powerups.length; q++) drawPowerup(g, g.powerups[q]);
  for (var i = 0; i < g.tanks.length; i++) if (g.tanks[i].alive) drawTank(g, g.tanks[i]);

  // 护盾光环
  if (g.player && g.player.alive && g.player.shieldT > 0) {
    var sp = 0.5 + 0.5 * Math.sin(g.time * 8);
    ctx.strokeStyle = "rgba(111,195,255," + (0.5 + 0.4 * sp).toFixed(2) + ")";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(g.player.x, HUD + g.player.y, 24 + 3 * sp, 0, Math.PI * 2);
    ctx.stroke();
  }

  for (var b = 0; b < g.bullets.length; b++) drawBullet(g, g.bullets[b]);
  for (var p = 0; p < g.particles.length; p++) drawParticle(g, g.particles[p]);
  drawHud(g);

  if (g.toast) {
    ctx.globalAlpha = Math.min(1, g.toast.t * 1.6);
    ctx.font = "700 15px " + FONT;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = g.toast.color;
    ctx.fillText(g.toast.text, g.player.x, HUD + g.player.y - 36);
    ctx.globalAlpha = 1;
  }

  if (g.bannerT > 0 && g.bannerText) {
    ctx.font = "700 26px " + FONT;
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(g.bannerText, W / 2 + 2, HUD + H * 0.36 + 2);
    ctx.fillStyle = C.white;
    ctx.fillText(g.bannerText, W / 2, HUD + H * 0.36);
  }
  drawOverlay(g);
}

function drawStatic(g) {
  var ctx = g.ctx;
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, CW, CH);

  if (g.bg) {
    ctx.drawImage(g.bg, 0, HUD, W, H);
    ctx.fillStyle = "rgba(7,10,16," + BG_DIM + ")";
    ctx.fillRect(0, HUD, W, H);
  }

  ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
  for (var x = 0; x <= W; x += CELL) {
    ctx.beginPath(); ctx.moveTo(x + 0.5, HUD); ctx.lineTo(x + 0.5, CH); ctx.stroke();
  }
  for (var y = HUD; y <= CH; y += CELL) {
    ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); ctx.stroke();
  }

  g.tiles.forEach(function (kind, k) {
    var r = Math.floor(k / COLS), c = k % COLS;
    var px = c * CELL, py = HUD + r * CELL;
    if (kind === "B") {
      ctx.fillStyle = C.brick;
      ctx.fillRect(px, py, CELL, CELL);
      ctx.strokeStyle = C.brickDark; ctx.lineWidth = 1;
      ctx.strokeRect(px + 0.5, py + 0.5, CELL - 1, CELL - 1);
      ctx.strokeStyle = C.brickEdge;
      ctx.beginPath(); ctx.moveTo(px, py + CELL / 2); ctx.lineTo(px + CELL, py + CELL / 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px + CELL / 2, py); ctx.lineTo(px + CELL / 2, py + CELL / 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px + CELL / 4, py + CELL / 2); ctx.lineTo(px + CELL / 4, py + CELL); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px + CELL * 3 / 4, py + CELL / 2); ctx.lineTo(px + CELL * 3 / 4, py + CELL); ctx.stroke();
    } else {
      ctx.fillStyle = C.steel;
      ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
      ctx.strokeStyle = C.steelDark; ctx.lineWidth = 2;
      ctx.strokeRect(px + 1, py + 1, CELL - 2, CELL - 2);
      ctx.fillStyle = C.steelLight;
      ctx.fillRect(px + 9, py + 9, CELL - 18, CELL - 18);
    }
  });
}

function drawTank(g, t) {
  var ctx = g.ctx;
  var x = t.x, y = HUD + t.y, h = halfOf(t);
  var isPlayer = t.kind === "player";
  var body, light, dark;
  if (isPlayer) { body = C.player; light = C.playerLight; dark = C.playerDark; }
  else if (t.elite) {
    body = "#2a1a3d"; light = "#b57bff"; dark = "#140b22";
    drawEliteAura(g, x, y, h);
  }
  else {
    body = C.enemy; light = C.enemyLight; dark = C.enemyDark;
    drawEnemyHighlight(g, x, y, h, t.spawnFlash);
  }

  if (isPlayer && t.invuln > 0 && Math.floor(g.time * 12) % 2 === 0) {
    ctx.strokeStyle = C.playerLight; ctx.lineWidth = 2;
    ctx.strokeRect(x - h, y - h, h * 2, h * 2);
    return;
  }

  if (t.dir === "up" || t.dir === "down") {
    ctx.fillStyle = dark;
    ctx.fillRect(x - h - 3, y - h - 1, 9, h * 2 + 2);
    ctx.fillRect(x + h - 6, y - h - 1, 9, h * 2 + 2);
  } else {
    ctx.fillStyle = dark;
    ctx.fillRect(x - h - 1, y - h - 3, h * 2 + 2, 9);
    ctx.fillRect(x - h - 1, y + h - 6, h * 2 + 2, 9);
  }
  ctx.fillStyle = body;
  ctx.fillRect(x - h + 2, y - h + 2, (h - 2) * 2, (h - 2) * 2);
  ctx.strokeStyle = light; ctx.lineWidth = 2;
  ctx.strokeRect(x - h + 2, y - h + 2, (h - 2) * 2, (h - 2) * 2);

  if (t.elite) {
    drawDragonHead(g, x, y, h);
  } else {
    ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2);
    ctx.fillStyle = light; ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = 1; ctx.stroke();

    var v = DIRV[t.dir];
    ctx.strokeStyle = light; ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x + v[0] * 3, y + v[1] * 3);
    ctx.lineTo(x + v[0] * (h + 9), y + v[1] * (h + 9));
    ctx.stroke();
  }

  if (t.maxHp > 1) {

function drawEliteAura(g, x, y, h) {
  var ctx = g.ctx;

// 黑化奶龙：紫色龙头 + 发光红眼 + 尖角

function drawEnemyHighlight(g, x, y, h, spawnFlash) {
  var ctx = g.ctx;

  var glow = lerpColor(C.glowA, C.glowB, pulse);
  var pad = 7 + 3 * pulse;
  ctx.strokeStyle = glow; ctx.lineWidth = 2;
  ctx.strokeRect(x - h - pad, y - h - pad, (h + pad) * 2, (h + pad) * 2);

  var p2 = pad + 6, L = 8;
  var bx0 = x - h - p2, by0 = y - h - p2, bx1 = x + h + p2, by1 = y + h + p2;
  var corners = [[bx0, by0, 1, 1], [bx1, by0, -1, 1], [bx0, by1, 1, -1], [bx1, by1, -1, -1]];
  for (var i = 0; i < corners.length; i++) {

function drawBullet(g, b) {

function drawPowerIcon(ctx, type, x, y, s, color) {
  ctx.fillStyle = color; ctx.strokeStyle = color;

    ctx.lineTo(x + s * 0.04, y + s * 0.08);

    ctx.beginPath();
    ctx.moveTo(x, y - s);
    ctx.lineTo(x + s * 0.85, y - s * 0.52);
    ctx.lineTo(x + s * 0.68, y + s * 0.46);
    ctx.lineTo(x, y + s);
    ctx.lineTo(x - s * 0.68, y + s * 0.46);
    ctx.lineTo(x - s * 0.85, y - s * 0.52);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(x - s * 0.78, y - s * 0.62); ctx.lineTo(x - s * 0.12, y); ctx.lineTo(x - s * 0.78, y + s * 0.62);
    ctx.moveTo(x + s * 0.06, y - s * 0.62); ctx.lineTo(x + s * 0.72, y); ctx.lineTo(x + s * 0.06, y + s * 0.62);

}

function drawPowerup(g, it) {
  var ctx = g.ctx, d = PU[it.type];
  var x = it.x, y = HUD + it.y;
  if (it.life < 3 && Math.floor(it.t * 8) % 2 === 0) return;   // 快消失时闪烁

  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);

function drawHud(g) {
  var ctx = g.ctx;
  ctx.fillStyle = C.hudBg;
  ctx.fillRect(0, 0, CW, HUD);
  ctx.strokeStyle = "#2a3546"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, HUD + 0.5); ctx.lineTo(CW, HUD + 0.5); ctx.stroke();

function drawOverlay(g) {

    ctx.font = "16px " + FONT;
    ctx.fillStyle = C.hudFg;

// ---------------------------------------------------------------------------
// 输入
// ---------------------------------------------------------------------------
function mapKey(k) {
  if (k === "ArrowUp" || k === "Up" || k === "w" || k === "W") return "up";
  if (k === "ArrowDown" || k === "Down" || k === "s" || k === "S") return "down";
  if (k === "ArrowLeft" || k === "Left" || k === "a" || k === "A") return "left";
  if (k === "ArrowRight" || k === "Right" || k === "d" || k === "D") return "right";
  if (k === " " || k === "Spacebar" || k === "Space") return "fire";
  if (k === "p" || k === "P") return "pause";
  if (k === "r" || k === "R") return "restart";
  if (k === "Enter") return "start";
  return null;
}

function togglePause(g) {
  if (g.state === "playing") g.state = "paused";
  else if (g.state === "paused") g.state = "playing";
}

function bindInput(g) {
  var canvas = g.canvas;

  window.addEventListener("keydown", function (e) {
    if (window.__tankActive === false) return;
    var a = mapKey(e.key);
    if (!a) return;
    e.preventDefault();
    if (a === "start") {
      if (g.state === "ready" || g.state === "over" || g.state === "paused") startGame(g);
      return;
    }
    if (a === "pause") { togglePause(g); return; }
    if (a === "restart") { startGame(g); return; }
    g.keys.add(a);
  });
  window.addEventListener("keyup", function (e) {
    var a = mapKey(e.key);
    if (a && a !== "start" && a !== "pause" && a !== "restart") g.keys.delete(a);
  });

  canvas.addEventListener("pointerdown", function (ev) {
    ev.preventDefault();
    if (g.state === "ready" || g.state === "over") startGame(g);
    else if (g.state === "paused") g.state = "playing";
  });

  var touch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  g.isTouch = touch;
  if (touch) document.body.classList.add("touch");

  function bindHold(el, key) {
    function down(ev) { ev.preventDefault(); g.keys.add(key); }
    function up(ev) { ev.preventDefault(); g.keys.delete(key); }
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    el.addEventListener("pointerleave", up);
    el.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });
  }

  var btns = document.querySelectorAll("[data-key]");
  for (var i = 0; i < btns.length; i++) bindHold(btns[i], btns[i].getAttribute("data-key"));

  var acts = document.querySelectorAll("[data-act]");
  for (var j = 0; j < acts.length; j++) {
    (function (el) {
      el.addEventListener("pointerdown", function (ev) {
        ev.preventDefault();
        var act = el.getAttribute("data-act");
        if (act === "pause") togglePause(g);
        else if (act === "restart") startGame(g);
      });
    })(acts[j]);
  }
}

// ---------------------------------------------------------------------------
// 启动
// ---------------------------------------------------------------------------
function loadBackground(g) {
  if (typeof Image === "undefined") return;
  if (!/^data:image\//.test(BG_DATA)) return;
  var img = new Image();
  img.onload = function () { g.bg = img; g.dirty = true; };
  img.src = BG_DATA;
}

function fitCanvas(canvas, ctx) {
  var s = Math.min(window.innerWidth / CW, window.innerHeight / CH);
  if (!isFinite(s) || s <= 0) s = 1;
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.style.width = Math.round(CW * s) + "px";
  canvas.style.height = Math.round(CH * s) + "px";
  var bw = Math.round(CW * s * dpr), bh = Math.round(CH * s * dpr);
  if (canvas.width !== bw || canvas.height !== bh) {
    canvas.width = bw;
    canvas.height = bh;
  }
  ctx.setTransform(bw / CW, 0, 0, bh / CH, 0, 0);
}

function boot() {
  var canvas = document.getElementById("t-game");
  canvas.width = CW;
  canvas.height = CH;
  var ctx = canvas.getContext("2d");
  var g = createGame(canvas, ctx);
  window.__tankGame = g;
  window.__tankDebug = { startGame: startGame, dropPowerup: dropPowerup, spawnElite: spawnElite, makeTank: makeTank };
  loadBackground(g);
  bindInput(g);
  fitCanvas(canvas, ctx);
  window.addEventListener("resize", function () { fitCanvas(canvas, ctx); g.dirty = true; });
  window.addEventListener("orientationchange", function () { fitCanvas(canvas, ctx); g.dirty = true; });

  // 竖屏提示：横过来才看得清；坚持竖屏也能玩
  var stayPortrait = false;
  function checkOrientation() {
    var isTouch = document.body.classList.contains("touch");
    var portrait = window.innerHeight > window.innerWidth * 1.05;
    var show = isTouch && portrait && !stayPortrait && window.__tankActive !== false;
    document.body.classList.toggle("portrait", show);
    if (show && g.state === "playing") { g.state = "paused"; g.__autoPaused = true; }
    else if (!show && g.state === "paused" && g.__autoPaused) { g.state = "playing"; g.__autoPaused = false; }
  }
  var stayBtn = document.getElementById("stayPortrait");
  if (stayBtn) {
    stayBtn.addEventListener("click", function () {
      stayPortrait = true;
      document.body.classList.remove("portrait");
      if (g.state === "paused" && g.__autoPaused) { g.state = "playing"; g.__autoPaused = false; }
    });
  }
  checkOrientation();
  window.addEventListener("resize", checkOrientation);
  window.addEventListener("orientationchange", function () { setTimeout(checkOrientation, 120); });

  var last = (typeof performance !== "undefined" ? performance.now() : Date.now());
  function frame(now) {
    if (window.__tankActive === false) { requestAnimationFrame(frame); return; }
    var dt = Math.min((now - last) / 1000, 0.06);
    last = now;
    g.time += dt;
    if (g.state === "playing") step(g, dt);
    render(g);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

if (typeof document !== "undefined" && document.getElementById("game")) {
  boot();
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    createGame: createGame, startGame: startGame, step: step, render: render,
    fire: fire, makeTank: makeTank, makeBullet: makeBullet, hitTank: hitTank,
    beginWave: beginWave, dropPowerup: dropPowerup, spawnElite: spawnElite, PU: PU,
    CW: CW, CH: CH, W: W, H: H, CELL: CELL, COLS: COLS, ROWS: ROWS, HUD: HUD,
    PLAYER_HP: PLAYER_HP, BULLET_SPEED: BULLET_SPEED, INVULN_TIME: INVULN_TIME
  };
}
})();

<script>

(function () {
"use strict";

// ===========================================================================
// 纯逻辑（可在 Node 中测试）
// ===========================================================================
var SIZE = 15;
var DIRS = [[1, 0], [0, 1], [1, 1], [1, -1]];

function newBoard() {
  var b = new Array(SIZE * SIZE);
  for (var i = 0; i < b.length; i++) b[i] = 0;
  return b;
}

// 从 idx 落子后判断是否成五，返回 {winner, line}
function checkWin(board, idx, player) {
  var r0 = Math.floor(idx / SIZE), c0 = idx % SIZE;
  for (var d = 0; d < DIRS.length; d++) {
    var dr = DIRS[d][0], dc = DIRS[d][1];
    var line = [idx];
    for (var s = 1; s < SIZE; s++) {
      var r = r0 + dr * s, c = c0 + dc * s;
      if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) break;
      if (board[r * SIZE + c] !== player) break;
      line.push(r * SIZE + c);
    }
    for (var s2 = 1; s2 < SIZE; s2++) {
      var r2 = r0 - dr * s2, c2 = c0 - dc * s2;
      if (r2 < 0 || r2 >= SIZE || c2 < 0 || c2 >= SIZE) break;
      if (board[r2 * SIZE + c2] !== player) break;
      line.push(r2 * SIZE + c2);
    }
    if (line.length >= 5) {
      line.sort(function (a, b) { return a - b; });
      return { winner: player, line: line };
    }
  }
  return { winner: 0, line: [] };
}

function placeStone(board, idx, player) {
  if (idx < 0 || idx >= board.length || board[idx] !== 0) return false;
  board[idx] = player;
  return true;
}

var api = {
  SIZE: SIZE, newBoard: newBoard, checkWin: checkWin, placeStone: placeStone
};
if (typeof module !== "undefined" && module.exports) module.exports = api;
if (typeof document === "undefined") return;

// ===========================================================================
// 界面
// ===========================================================================
var $ = function (id) { return document.getElementById(id); };
var canvas = $("board"), ctx = canvas.getContext("2d");
var wrap = $("boardWrap");

var state = {
  board: newBoard(),
  turn: 1,
  winner: 0,
  line: [],
  last: -1,
  moves: 0,
  mode: "local",     // local | online
  mySeat: 0,
  room: "",
  players: 0,
  online: false
};
var history = [];    // 本地悔棋用的快照
window.__gomoku = state;   // 调试/自动化用
window.__gomokuLeave = function () { leaveToMenu(); };
var pad = 18;        // 棋盘边距（逻辑像素）
var cell = 40;
var dpr = 1;

// ---------- 绘图 ----------
function layout() {
  var w = wrap.clientWidth, h = wrap.clientHeight;
  var side = Math.max(240, Math.min(w, h) - 4);
  cell = (side - pad * 2) / (SIZE - 1);
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(side * dpr);
  canvas.height = Math.round(side * dpr);
  canvas.style.width = side + "px";
  canvas.style.height = side + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function px(c) { return pad + c * cell; }

function draw() {
  var side = canvas.width / dpr;
  ctx.clearRect(0, 0, side, side);

  // 棋盘底
  ctx.fillStyle = "#141d2a";
  ctx.fillRect(0, 0, side, side);

  // 网格
  ctx.strokeStyle = "#2b3b52";
  ctx.lineWidth = 1;
  for (var i = 0; i < SIZE; i++) {
    var p = px(i);
    ctx.beginPath(); ctx.moveTo(px(0), p); ctx.lineTo(px(SIZE - 1), p); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p, px(0)); ctx.lineTo(p, px(SIZE - 1)); ctx.stroke();
  }

  // 星位
  var stars = [[3, 3], [3, 11], [11, 3], [11, 11], [7, 7]];
  ctx.fillStyle = "#40536e";
  for (var s = 0; s < stars.length; s++) {
    ctx.beginPath();
    ctx.arc(px(stars[s][0]), px(stars[s][1]), Math.max(2, cell * 0.08), 0, Math.PI * 2);
    ctx.fill();
  }

  // 棋子
  var r = cell * 0.44;
  for (var idx = 0; idx < state.board.length; idx++) {
    var v = state.board[idx];
    if (!v) continue;
    var cx = px(idx % SIZE), cy = px(Math.floor(idx / SIZE));
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    if (v === 1) {
      var g1 = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.15, cx, cy, r);
      g1.addColorStop(0, "#3d4a5e"); g1.addColorStop(1, "#10161f");
      ctx.fillStyle = g1;
    } else {
      var g2 = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.15, cx, cy, r);
      g2.addColorStop(0, "#ffffff"); g2.addColorStop(1, "#c8d4e6");
      ctx.fillStyle = g2;
    }
    ctx.fill();
    ctx.strokeStyle = v === 1 ? "#00000066" : "#ffffff88";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // 最后一手
  if (state.last >= 0 && state.board[state.last]) {
    var lx = px(state.last % SIZE), ly = px(Math.floor(state.last / SIZE));
    ctx.beginPath();
    ctx.arc(lx, ly, Math.max(3, r * 0.28), 0, Math.PI * 2);
    ctx.fillStyle = "#ff5f6d";
    ctx.fill();
  }

  // 胜利连线
  if (state.line && state.line.length >= 5) {
    ctx.strokeStyle = "#4fd1a5";
    ctx.lineWidth = Math.max(3, cell * 0.12);
    ctx.lineCap = "round";
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    var first = state.line[0], lastOne = state.line[state.line.length - 1];
    ctx.moveTo(px(first % SIZE), px(Math.floor(first / SIZE)));
    ctx.lineTo(px(lastOne % SIZE), px(Math.floor(lastOne / SIZE)));
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

// ---------- 状态 UI ----------
function refreshStatus() {
  var dot = $("turnDot"), txt = $("turnText");
  if (state.winner) {
    txt.textContent = (state.winner === 1 ? "黑棋" : "白棋") + "获胜！";
    dot.className = "dot " + (state.winner === 1 ? "black" : "white");
    return;
  }
  if (state.mode === "online" && state.players < 2) {
    txt.textContent = "等待对手加入…";
    dot.className = "dot";
    return;
  }
  if (state.mode === "online" && state.mySeat && state.turn !== state.mySeat) {
    txt.textContent = "等待对方落子…";
    dot.className = "dot " + (state.turn === 1 ? "black" : "white");
    return;
  }
  txt.textContent = (state.turn === 1 ? "黑棋" : "白棋") + "回合" +
    (state.mode === "online" ? (state.turn === state.mySeat ? "（你）" : "") : "");
  dot.className = "dot " + (state.turn === 1 ? "black" : "white");
}

function toast(msg) {
  var t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.classList.remove("show"); }, 1800);
}

// ---------- 落子 ----------
function canPlay(idx) {
  if (state.winner) return false;
  if (state.board[idx] !== 0) return false;
  if (state.mode === "local") return true;
  if (state.players < 2) return false;
  return state.mySeat === state.turn;
}

function playLocal(idx) {
  if (!canPlay(idx)) return;
  history.push({ board: state.board.slice(), turn: state.turn, winner: state.winner, line: state.line.slice(), last: state.last, moves: state.moves });
  placeStone(state.board, idx, state.turn);
  state.last = idx;
  state.moves++;
  var res = checkWin(state.board, idx, state.turn);
  if (res.winner) { state.winner = res.winner; state.line = res.line; }
  else state.turn = 3 - state.turn;
  draw();
  refreshStatus();
}

function playOnline(idx) {
  if (!canPlay(idx)) {
    if (state.players < 2) toast("还在等对手加入");
    else if (state.turn !== state.mySeat) toast("还没轮到你");
    return;
  }
  post("/api/move", { room: state.room, seat: state.mySeat, index: idx });
}

// ---------- 联机 ----------
var es = null;

// 断线重连凭证：同一房间记住自己的座位
function tokenKey(room) { return "gomoku:token:" + room; }
function saveToken(room, token) { try { if (token) localStorage.setItem(tokenKey(room), token); } catch (e) {} }
function loadToken(room) { try { return localStorage.getItem(tokenKey(room)) || ""; } catch (e) { return ""; } }

function post(url, body) {
  return fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }).then(function (r) { return r.json(); });
}

function applyState(s) {
  state.board = s.board;
  state.turn = s.turn;
  state.winner = s.winner;
  state.line = s.line || [];
  state.last = s.last != null ? s.last : -1;
  state.players = s.players;
  if (s.moves != null) state.moves = s.moves;
  draw();
  refreshStatus();
  if (state.players >= 2) $("waitMsg").textContent = "对手已加入，开始对局！";
}

function connect(room, seat) {
  state.room = room;
  state.mySeat = seat;
  state.mode = "online";
  if (es) es.close();
  es = new EventSource("/api/stream?room=" + encodeURIComponent(room) + "&seat=" + seat);
  es.onmessage = function (e) {
    var s = JSON.parse(e.data);
    applyState(s);
    if (s.players >= 2 && $("lobby").classList.contains("hide") === false) {
      enterGame();
    }
  };
  es.onerror = function () { /* EventSource 自动重连 */ };
}

function enterGame() {
  $("menu").classList.add("hide");
  $("lobby").classList.add("hide");
  $("game").classList.remove("hide");
  $("modeLabel").textContent = state.mode === "online"
    ? ("联机 · 房间 " + state.room + " · 你执" + (state.mySeat === 1 ? "黑" : "白"))
    : "同屏双人";
  $("btnUndo").disabled = state.mode === "online";
  layout();
  refreshStatus();
}

function leaveToMenu() {
  if (es) { es.close(); es = null; }
  state.mode = "local";
  $("game").classList.add("hide");
  $("lobby").classList.add("hide");
  $("menu").classList.remove("hide");
  $("modeLabel").textContent = "同屏双人";
}

// ---------- 事件 ----------
canvas.addEventListener("pointerdown", function (ev) {
  ev.preventDefault();
  var rect = canvas.getBoundingClientRect();
  var x = (ev.clientX - rect.left) / rect.width * (canvas.width / dpr);
  var y = (ev.clientY - rect.top) / rect.height * (canvas.height / dpr);
  var c = Math.round((x - pad) / cell), r = Math.round((y - pad) / cell);
  if (c < 0 || c >= SIZE || r < 0 || r >= SIZE) return;
  // 点太远就不算
  var dx = x - px(c), dy = y - px(r);
  if (Math.sqrt(dx * dx + dy * dy) > cell * 0.62) return;
  var idx = r * SIZE + c;
  if (state.mode === "local") playLocal(idx);
  else playOnline(idx);
});

$("btnLocal").onclick = function () {
  state.mode = "local";
  state.board = newBoard();
  state.turn = 1; state.winner = 0; state.line = []; state.last = -1; state.moves = 0;
  history = [];
  enterGame();
};

$("btnOnline").onclick = function () {
  $("menu").classList.add("hide");
  $("lobby").classList.remove("hide");
  $("lobbyHome").classList.remove("hide");
  $("lobbyWait").classList.add("hide");
  if (location.protocol === "file:") {
    toast("联机需要通过服务器地址打开，见说明");
  }
};

$("btnCreate").onclick = function () {
  if (location.protocol === "file:") { toast("请用 http:// 地址打开才能联机"); return; }
  post("/api/create", {}).then(function (res) {
    if (!res.room) { toast(res.error || "创建失败"); return; }
    $("lobbyHome").classList.add("hide");
    $("lobbyWait").classList.remove("hide");
    $("roomCode").textContent = res.room;
    $("seatInfo").textContent = "你是黑棋（先手）";
    var link = location.origin + location.pathname + "?room=" + res.room;
    $("linkBox").textContent = link;
    $("btnCopy").dataset.link = link;
    $("waitMsg").textContent = "等待对手加入…（把房间号或链接发给好友）";
    saveToken(res.room, res.token);
    connect(res.room, res.seat);
  });
};

$("btnJoin").onclick = function () {
  var code = ($("roomInput").value || "").trim();
  if (!/^\d{4}$/.test(code)) { toast("请输入 4 位数字房间号"); return; }
  doJoin(code);
};

function doJoin(code) {
  post("/api/join", { room: code, token: loadToken(code) }).then(function (res) {
    if (res.error) { toast(res.error); return; }
    saveToken(code, res.token);
    $("lobbyHome").classList.add("hide");
    $("lobbyWait").classList.remove("hide");
    $("roomCode").textContent = code;
    $("seatInfo").textContent = "你是" + (res.seat === 1 ? "黑棋（先手）" : "白棋（后手）");
    $("linkBox").textContent = location.origin + location.pathname + "?room=" + code;
    $("btnCopy").dataset.link = $("linkBox").textContent;
    $("waitMsg").textContent = res.seat === 1 ? "等待对手加入…" : "已加入，等待房主放行…";
    connect(code, res.seat);
  });
}

$("btnCopy").onclick = function () {
  var link = $("btnCopy").dataset.link || "";
  if (!link) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(link).then(function () { toast("链接已复制"); },
      function () { toast("复制失败，请长按链接手动复制"); });
  } else {
    var ta = document.createElement("textarea");
    ta.value = link; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("链接已复制"); } catch (e) { toast("请长按链接手动复制"); }
    document.body.removeChild(ta);
  }
};

$("btnShare").onclick = function () {
  var url = $("btnCopy").dataset.link || location.href;
  if (navigator.share) {
    navigator.share({ title: "来下五子棋", text: "房间号 " + state.room + "，点链接加入：", url: url })
      .catch(function () {});
  } else {
    toast("当前浏览器不支持分享，请复制链接");
  }
};

$("btnBack").onclick = function () { leaveToMenu(); };

$("btnRestart").onclick = function () {
  if (state.mode === "online") {
    post("/api/restart", { room: state.room, seat: state.mySeat });
  } else {
    state.board = newBoard(); state.turn = 1; state.winner = 0;
    state.line = []; state.last = -1; state.moves = 0; history = [];
    draw(); refreshStatus();
  }
};

$("btnUndo").onclick = function () {
  if (state.mode === "online") return;
  var prev = history.pop();
  if (!prev) { toast("没有可悔的棋"); return; }
  state.board = prev.board; state.turn = prev.turn; state.winner = prev.winner;
  state.line = prev.line; state.last = prev.last; state.moves = prev.moves;
  draw(); refreshStatus();
};

$("btnLeave").onclick = function () { leaveToMenu(); };

// 通过邀请链接进入：?room=1234
var params = new URLSearchParams(location.search);
var roomParam = params.get("room");
if (roomParam && /^\d{4}$/.test(roomParam)) {
  $("menu").classList.add("hide");
  $("lobby").classList.remove("hide");
  $("lobbyHome").classList.remove("hide");
  $("lobbyWait").classList.add("hide");
  $("roomInput").value = roomParam;
  setTimeout(function () { doJoin(roomParam); }, 200);
}

window.addEventListener("resize", layout);
window.addEventListener("orientationchange", function () { setTimeout(layout, 120); });
layout();
refreshStatus();
})();

</script>
<script>

(function () {
  "use strict";
  var home = document.getElementById("home");
  var views = { tank: document.getElementById("view-tank"), gomoku: document.getElementById("view-gomoku") };

  function show(name) {
    home.classList.toggle("active", name === "home");
    Object.keys(views).forEach(function (k) { views[k].classList.toggle("active", k === name); });
    window.__tankActive = (name === "tank");
    if (name !== "tank" && window.__tankGame && window.__tankGame.state === "playing") {
      window.__tankGame.state = "paused";
    }
    if (name !== "gomoku" && window.__gomokuLeave) window.__gomokuLeave();
    setTimeout(function () { window.dispatchEvent(new Event("resize")); }, 50);
  }
  window.__arcadeShow = show;

  document.querySelectorAll("[data-go]").forEach(function (el) {
    el.addEventListener("click", function () { show(el.getAttribute("data-go")); });
  });
  var th = document.getElementById("tankHome");
  if (th) th.addEventListener("click", function () { show("home"); });
  var gh = document.getElementById("gomokuHome");
  if (gh) gh.addEventListener("click", function () { show("home"); });

  // 邀请链接 ?room=1234 直接进入五子棋
  var params = new URLSearchParams(location.search);
  if (params.get("room")) show("gomoku");
  else show("home");
})();

</script>
